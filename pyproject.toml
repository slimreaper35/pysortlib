[project]
name = "pysortlib"
version = "1.0.1"
description = "Python Sorting Library"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Michal Šoltis", email = "msoltis147@gmail.com" }]
keywords = ["algorithms", "data structures", "sorting"]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.14.3",
  "ty>=0.0.65",
]
optional = ["pyupgrade>=3.21.0"]
test = [
  "hypothesis>=6.142.5",
  "nox>=2025.10.16",
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "pytest-rich>=0.2.0",
]

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"
